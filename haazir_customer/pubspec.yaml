name: haazir_customer
description: "Haazir Customer App - On-demand local services marketplace"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/haazir_icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0F4C3A"
  image: assets/branding/haazir_icon.png
  android_12:
    color: "#0F4C3A"
    image: assets/branding/haazir_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/haazir_icon.png
