version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: haazir_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: haazir_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: haazir_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: .
    container_name: haazir_api
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/haazir_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=production-secret-key-change-me

volumes:
  postgres_data:
  redis_data:
