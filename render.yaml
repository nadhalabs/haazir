services:
  - type: web
    name: haazir-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    preDeployCommand: alembic upgrade head && python -m app.seed
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: haazir-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: haazir-presence
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: HAAZIR_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: HAAZIR_BOOTSTRAP_ADMIN_PHONE
        sync: false
      - key: HAAZIR_BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  - type: keyvalue
    name: haazir-presence
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: haazir-postgres
    plan: basic-256mb
    databaseName: haazir
    user: haazir
